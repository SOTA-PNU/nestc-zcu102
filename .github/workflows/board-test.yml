name: board-test

# GitLab CI 의 test-board 스테이지를 옮긴 것.
# 원본은 etri-board 러너에서 돌았고, 정작 실행(`sudo make check_zcu102`)은
# 주석 처리되어 있었다. 여기서는 실제로 실행한다.
#
# 러너는 보드가 아니라 PC 에 둔다. 보드는 Ubuntu 18.04(glibc 2.27)라
# Node 20 기반 액션(actions/checkout@v4 등)이 실행되지 않고,
# 가용 메모리도 1.5GB 뿐이라 러너를 올리면 빌드와 충돌한다.
# PC 러너가 SSH 로 보드에 명령만 보낸다.
#
# 필요한 저장소 시크릿:
#   BOARD_HOST     보드 주소
#   BOARD_PORT     SSH 포트
#   BOARD_USER     xilinx
#   BOARD_SSH_KEY  보드 ~/.ssh/authorized_keys 에 등록한 개인키 전문
#
# 보드 사전 준비:
#   ~/bin/aws         죽은 S3 버킷 대신 gitlab nestc-data 에서 받는 shim
#   sudo NOPASSWD     ctest 가 /dev/xlnk 와 VTA 레지스터에 접근해야 한다

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "빌드 디렉터리를 지우고 처음부터"
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 KST

jobs:
  zcu102:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 360

    # 두 CPU 폴백 구현을 모두 돌린다.
    # 보드가 하나뿐이라 동시에 실행하면 VTA 가 충돌하므로 직렬로 둔다.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - impl: generic
            generic: "ON"
            build: build_ci_generic
          - impl: aarch64
            generic: "OFF"
            build: build_ci_aarch64

    env:
      SRC: /home/xilinx/nest-compiler-2024
      BUILD: /home/xilinx/nest-compiler-2024/${{ matrix.build }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: SSH 준비
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BOARD_SSH_KEY }}" > ~/.ssh/board_key
          chmod 600 ~/.ssh/board_key
          cat > ~/.ssh/config <<EOF
          Host board
            HostName ${{ secrets.BOARD_HOST }}
            Port ${{ secrets.BOARD_PORT }}
            User ${{ secrets.BOARD_USER }}
            IdentityFile ~/.ssh/board_key
            ServerAliveInterval 60
            ServerAliveCountMax 10
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          ssh board 'uname -a; free -h | head -2; df -h / | tail -1'

      - name: 상류 소스 갱신
        run: |
          ssh board "set -eu
            if [ ! -d $SRC/.git ]; then
              git clone --recursive https://gitlab.com/ones-ai/nest-compiler.git $SRC
            else
              cd $SRC && git fetch origin && git reset --hard origin/main \
                && git submodule update --init --recursive
            fi
            cd $SRC && git log --oneline -1"

      # 상류 vtalib 의 transpose() 가 미구현 스텁이라
      # aarch64 경로에서 입력과 무관한 고정 출력이 나온다.
      # 멱등하므로 두 경로 모두에 적용해 둔다.
      - name: transpose 패치
        run: |
          scp ci/patch_transpose.py board:/home/xilinx/patch_transpose.py
          ssh board "set -eu
            python3 /home/xilinx/patch_transpose.py \
              $SRC/vta/vtalib/lib/Bundle/CPUBundle_aarch64.cpp
            grep -c at8dim_nestc_patch $SRC/vta/vtalib/lib/Bundle/CPUBundle_aarch64.cpp"

      # generic 과 aarch64 는 CPU 폴백 구현 전체가 달라 오브젝트를 공유할 수 없다.
      # 반드시 별도 디렉터리에 둔다.
      - name: 설정
        run: |
          CLEAN=""
          [ "${{ inputs.rebuild }}" = "true" ] && CLEAN="rm -rf $BUILD;"
          ssh board "set -eu
            export PATH=\$HOME/bin:\$PATH
            $CLEAN
            mkdir -p $BUILD && cd $BUILD
            cmake .. \
              -DNESTC_WITH_EVTA=ON \
              -DLLVM_DIR=/usr/lib/llvm-8.0/lib/cmake/llvm \
              -DCMAKE_BUILD_TYPE=Release \
              -DNESTC_USE_VTASIM=OFF \
              -DVTA_RESNET18_WITH_SKIPQUANT0=ON \
              -DNESTC_EVTA_RUN_ON_ZCU102=ON \
              -DNESTC_USE_PRECOMPILED_BUNDLE=ON \
              -DNESTC_EVTA_RUN_WITH_GENERIC_BUNDLE=${{ matrix.generic }} 2>&1 | tail -5"

      # 보드 메모리는 1.5GB 뿐이므로 -j1 로만 빌드한다.
      # zcu102 는 빌드 타깃이 아니라 끝에 ctest 를 실행하는 타깃이다.
      # 비root 로 돌면 반드시 실패하므로 종료 코드는 무시하고,
      # 실제 컴파일 에러만 따로 센다.
      - name: 번들 빌드
        run: |
          ssh board "set -eu
            export PATH=\$HOME/bin:\$PATH
            cd $BUILD
            make -j1 zcu102 > /home/xilinx/ci-build-${{ matrix.impl }}.log 2>&1 || true
            tail -5 /home/xilinx/ci-build-${{ matrix.impl }}.log
            echo '--- shim 호출 ---'
            grep -c 'aws-shim' /home/xilinx/ci-build-${{ matrix.impl }}.log || true"

      - name: 컴파일 에러 확인
        run: |
          N=$(ssh board "grep -cE 'error:' /home/xilinx/ci-build-${{ matrix.impl }}.log || true")
          echo "컴파일 에러 $N 건"
          [ "$N" = "0" ] || exit 1

      # VTA 프로그램 실행 중 중단은 금물이다.
      # FPGA 와 커널 메모리 할당기가 정리되지 않아 재부팅 전까지 보드를 쓸 수 없다.
      - name: ZCU102 테스트
        run: |
          ssh board "set -eu
            export PATH=\$HOME/bin:\$PATH
            cd $BUILD
            sudo -E env PATH=\$PATH ctest -L ZCU102 --output-on-failure \
              > /home/xilinx/ci-check-${{ matrix.impl }}.log 2>&1 || true
            tail -20 /home/xilinx/ci-check-${{ matrix.impl }}.log"

      # 상류는 aarch64 경로에서 ResNet-50 의 ZCU102 라벨을 떼어
      # 테스트 집합에서 제외한다(Resnet50Test/CMakeLists.txt:84).
      # transpose() 가 미구현 스텁이라 틀린 답을 내기 때문이다.
      # 우리 패치가 그것을 고쳤으므로, 여기서 직접 돌려 회귀를 막는다.
      - name: ResNet-50 회귀 검사 (aarch64 전용)
        if: matrix.impl == 'aarch64'
        run: |
          ssh board "set -eu
            export PATH=\$HOME/bin:\$PATH
            cd $BUILD && make -j1 vtaCaffe2Resnet50Bundle > /dev/null 2>&1
            cd $BUILD/vta/bundles/Resnet50Test
            IMG=$SRC/glow/tests/images/imagenet
            for pair in cat_285:281 dog_207:207 zebra_340:340; do
              img=\${pair%%:*}; want=\${pair##*:}
              got=\$(sudo -E env PATH=\$PATH ./vtaCaffe2Resnet50Bundle \$IMG/\$img.png \
                     | grep '^Result:' | awk '{print \$2}')
              echo \"\$img 기대 \$want 실제 \$got\"
              [ \"\$got\" = \"\$want\" ] || exit 1
            done"

      - name: 로그 회수
        if: always()
        run: |
          mkdir -p logs
          scp board:/home/xilinx/ci-build-${{ matrix.impl }}.log logs/ 2>/dev/null || true
          scp board:/home/xilinx/ci-check-${{ matrix.impl }}.log logs/ 2>/dev/null || true
          ls -la logs/

      # aarch64 의 알려진 실패 2건은 통과로 본다. 원인은 규명되어 있다.
      #   vtaFCTestBundle_compare — 재양자화 반올림 차이로 1000바이트 중 48개가
      #     1씩 다르다. *_compare 가 바이트 단위 완전 일치를 요구하는 것이 문제이지
      #     구현 결함이 아니다.
      #   vtaVGG16Cifar10Bundle — aarch64 FC 의 전제 조건(입력 16의 배수,
      #     출력 4의 배수)을 CIFAR-10 의 10 클래스가 만족하지 못해 -1 을 반환하는데
      #     호출부가 그 반환값을 검사하지 않는다. 상류 결함이며 별도로 보고한다.
      # 이 둘 외의 실패가 나오면 새로운 회귀다.
      - name: 결과 판정
        run: |
          LOG=logs/ci-check-${{ matrix.impl }}.log
          echo "=== 요약 ==="
          grep -E 'tests passed' "$LOG" || true

          sed -nE 's/^ +[0-9]+ - ([A-Za-z0-9_]+) \(Failed\)$/\1/p' "$LOG" \
            | sort -u > failed.txt

          if [ "${{ matrix.impl }}" = "aarch64" ]; then
            printf 'vtaFCTestBundle_compare\nvtaVGG16Cifar10Bundle\n' | sort > known.txt
          else
            : > known.txt
          fi

          UNEXPECTED=$(comm -23 failed.txt known.txt)
          if [ -n "$UNEXPECTED" ]; then
            echo "예상치 못한 실패:"
            echo "$UNEXPECTED"
            exit 1
          fi

          if [ -s failed.txt ]; then
            echo "알려진 실패만 발생 (허용):"
            cat failed.txt
          else
            echo "전부 통과"
          fi

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-test-${{ matrix.impl }}
          path: logs/
          retention-days: 30

      - name: 키 정리
        if: always()
        run: rm -f ~/.ssh/board_key
