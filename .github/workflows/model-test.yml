name: model-test

# models/ 아래의 모델을 전부 번들로 만들어 보드에서 추론까지 시키고 판정한다.
#
# 사람이 하는 일은 푸시 하나뿐이다. 어떤 모델을 돌릴지 고르지 않아도 되고,
# 결과를 보러 아티팩트를 받지 않아도 된다 — results/latest.md 로 저장소에
# 다시 커밋되므로 저장소를 당겨 보면 된다.
#
# board-test 가 상류 테스트의 회귀를 막는 장치라면, 이쪽은 우리가 올리는
# 모델을 위한 것이다. 모델 하나는 models/<이름>.conf 하나로 기술한다.
#
# 단일 코어 모델 다음에 4코어 멀티 EVTA(models-multi/resnet18-4core)도
# 돌린다. 네 코어를 다 쓰는 구성이 매 푸시마다 살아 있는지 보려는 것이다.
# 2코어와의 처리량 비교는 multievta 워크플로에 남겨 둔다.
#
# 러너는 PC(WSL x64) 의 self-hosted 다. 보드는 Ubuntu 18.04(glibc 2.27)라
# Node 20 기반 액션이 돌지 않고 가용 메모리도 615MB 뿐이다.
#
# 필요한 시크릿: BOARD_HOST BOARD_PORT BOARD_USER BOARD_SSH_KEY
#
# 러너 쪽 사전 준비:
#   NESTC_UPSTREAM  상류 클론 (기본 ~/nestc-upstream)

on:
  push:
    branches: [main]
    paths:
      - "models/**"
      - "ci/**"
      - "scripts/gen-bundle.sh"
      - "scripts/board-build-run.sh"
      - "models-multi/resnet18-4core.conf"
      - "scripts/board-multi-run.sh"
      - ".github/workflows/model-test.yml"
  workflow_dispatch:
    inputs:
      model:
        description: "한 모델만 돌릴 때 이름 (비우면 models/ 전부)"
        type: string
        default: ""
      board_build:
        description: "보드 빌드 디렉터리. generic=build_board, NEON+ACL=build_aarch64"
        type: choice
        options: [build_aarch64, build_board]
        default: build_aarch64

# 보드는 한 대뿐이다. 두 실행이 겹치면 VTA 가 충돌한다.
# 앞선 실행을 취소하지 않고 기다리게 한다 — VTA 실행 중 취소는 위험하다.
concurrency:
  group: zcu102-board
  cancel-in-progress: false

# 결과 요약을 저장소에 다시 커밋하기 위해 필요하다.
permissions:
  contents: write

jobs:
  model:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240

    env:
      BOARD_SRC: /home/xilinx/nest-compiler-2024
      # 기본은 aarch64 다. generic 은 CPU 폴백이 순수 C 라 느리다.
      # ResNet-18 실측: generic 1475ms 대 aarch64 91.6ms — 16배 차이다.
      # 게다가 aarch64 쪽 확신도(0.478113)가 ETRI 배포본과 정확히 일치한다.
      # 즉 aarch64 가 상류의 기준 구성이고 generic 이 곁길이었다.
      BOARD_BUILD: /home/xilinx/nest-compiler-2024/${{ inputs.board_build || 'build_aarch64' }}
      # 컴파일러를 빌드한 것과 같은 이미지여야 한다.
      # 라이브러리 버전이 다르면 실행조차 되지 않는다.
      DOCKER_IMAGE: leejaymin/nestc-ssh:latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 돌릴 모델 정하기
        id: pick
        run: |
          set -eu
          if [ -n "${{ inputs.model }}" ]; then
            LIST="${{ inputs.model }}"
            [ -f "models/$LIST.conf" ] || { echo "없는 모델: $LIST"; ls models/; exit 1; }
          else
            LIST=$(ls models/*.conf 2>/dev/null | sed 's|models/||; s|\.conf$||' | tr '\n' ' ')
          fi
          [ -n "$LIST" ] || { echo "models/ 에 conf 가 없다"; exit 1; }
          echo "대상: $LIST"
          echo "LIST=$LIST" >> "$GITHUB_ENV"

      - name: SSH 준비
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BOARD_SSH_KEY }}" > ~/.ssh/board_key
          chmod 600 ~/.ssh/board_key
          cat > ~/.ssh/config <<EOF
          Host board
            HostName ${{ secrets.BOARD_HOST }}
            Port ${{ secrets.BOARD_PORT }}
            User ${{ secrets.BOARD_USER }}
            IdentityFile ~/.ssh/board_key
            ServerAliveInterval 15
            ServerAliveCountMax 4
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          ssh board 'uname -m; free -h | head -2'

      # 컴파일러는 컨테이너(Ubuntu 20.04) 안에서 빌드되었으므로
      # 러너의 WSL(22.04)에서는 libprotobuf.so.17 을 찾지 못해 실행되지 않는다.
      # 그래서 번들 생성은 반드시 같은 이미지 안에서 돌린다.
      - name: 컴파일러 확인
        run: |
          set -eu
          UP=${NESTC_UPSTREAM:-$HOME/nestc-upstream}
          [ -d "$UP/build" ] || { echo "상류 빌드 트리가 없다: $UP/build" >&2; exit 1; }
          echo "NESTC_UPSTREAM=$UP" >> "$GITHUB_ENV"
          # 컨테이너 안에서의 경로다. 호스트 경로가 아니다.
          # /root 는 소유자만 접근 가능해 --user 로 돌리면 들어갈 수 없다.
          # 그래서 번들 생성 때는 상류 트리를 /src 에 마운트한다.
          echo "TOOLS_IN_CONTAINER=/src/build/glow/bin" >> "$GITHUB_ENV"
          docker image inspect "$DOCKER_IMAGE" >/dev/null 2>&1 || docker pull "$DOCKER_IMAGE"

      # 상류에 우리 패치를 적용한다. 전부 멱등하므로 매번 돌려도 안전하다.
      #   patch_concat.py  Concat(InsertTensor/Touch) 번들 경로 지원
      #   patch_tiling.py  튜닝 표에 없는 레이어의 기본 타일링
      # ninja 는 증분이라 바뀐 것이 없으면 몇 초 만에 끝난다.
      # 빌드 캐시가 /root/nestc 경로로 잡혀 있어 그 마운트를 그대로 써야 한다.
      - name: 컴파일러 패치 적용 및 재빌드
        run: |
          set -eu
          for p in ci/patch_concat.py ci/patch_tiling.py; do
            [ -f "$p" ] || continue
            echo "--- $p ---"
            python3 "$p" "$NESTC_UPSTREAM"
          done
          docker run --rm -v "$NESTC_UPSTREAM":/root/nestc \
            -w /root/nestc/build "$DOCKER_IMAGE" \
            ninja model-compiler image-classifier

      # 보드 쪽 런타임(vtalib)에 우리 패치를 적용한다.
      #   patch_relu_rescale.py   독립 ReLU 재양자화의 int8 포화 복원
      #   patch_vta_max_xfer.py   명령 큐를 32MB -> 16MB 로. 네 코어가 CMA 에
      #                           들어가게 하는 것이다. 근거는 그 파일 머리에.
      # 컴파일러 패치와 달리 이쪽은 보드에서 빌드해야 한다. make 는 증분이라
      # 바뀐 것이 없으면 금방 끝난다.
      #
      # VTABundle 하나만 짓지 않고 vta/vtalib 디렉터리를 통째로 짓는다.
      # VTA_MAX_XFER 는 driver.h 와 cmd_queue.h 에 걸쳐 있어 런타임
      # 라이브러리(libvta_runtime.a)도 같이 다시 지어야 하기 때문이다.
      - name: 보드 런타임 패치 적용 및 재빌드
        timeout-minutes: 30
        run: |
          # pipefail 이 없으면 tee/tail 의 종료 코드만 보게 되어
          # 보드 빌드가 실패해도 조용히 통과한다.
          set -euo pipefail
          mkdir -p logs
          # 러너가 Wi-Fi 라 SSH 가 중간에 끊기는 일이 있다. 2026-11-03 에
          # 보드에서는 빌드가 다 끝났는데 세션이 안 돌아와 단계가 매달렸다.
          # 패치는 멱등하고 make 는 증분이라 다시 돌려도 안전하다.
          for try in 1 2 3; do
            [ "$try" = 1 ] || echo "== SSH 재시도 $try"
          scp ci/patch_relu_rescale.py ci/patch_vta_max_xfer.py board:/home/xilinx/
          ssh board "set -euo pipefail
            python3 /home/xilinx/patch_relu_rescale.py /home/xilinx/nest-compiler-2024
            python3 /home/xilinx/patch_vta_max_xfer.py /home/xilinx/nest-compiler-2024
            echo '--- 적용된 VTA_MAX_XFER ---'
            grep -n 'define VTA_MAX_XFER' \
              /home/xilinx/nest-compiler-2024/vta/vtalib/include/zcu102/vta/driver.h
            cd $BOARD_BUILD/vta/vtalib
            echo '--- vtalib 전체 빌드 ---'
            make -j1 2>&1 | tail -25
            echo '--- 라이브러리 ---'
            ls -l libVTABundle.a libvta_runtime.a
            echo '--- 소스에 ReLU 패치 표식 ---'
            grep -c nestc_relu_rescale_patch \
              /home/xilinx/nest-compiler-2024/vta/vtalib/lib/Bundle/CPUBundle_generic.cpp
            echo '--- 라이브러리에 ReLU 패치 표식 (0 이면 재빌드 안 된 것) ---'
            strings libVTABundle.a | grep -c nestc_relu || true" \
            2>&1 | tee logs/board-patch.log && break
            [ "$try" = 3 ] && { echo "SSH 가 세 번 다 실패했다"; exit 1; }
            sleep 20
          done

      # 이 단계에서 VTA 가 열린다. 워크플로를 취소하면 보드가
      # 재부팅 전까지 사용 불가 상태가 될 수 있다.
      - name: 모델별 번들 생성과 보드 실행
        id: run
        run: |
          set -eu
          mkdir -p logs
          scp scripts/board-build-run.sh board:/home/xilinx/board-build-run.sh
          ssh board "chmod +x /home/xilinx/board-build-run.sh"

          : > logs/summary.txt
          HARD_FAIL=0

          for m in $LIST; do
            echo "::group::$m"
            CONF="models/$m.conf"
            OUT="$GITHUB_WORKSPACE/bundle-out/$m"
            BB="/home/xilinx/bundles/$m"

            # 아직 보드에서 통과하지 못하는 모델은 conf 에 KNOWN_FAIL=1 을 둔다.
            # 결과는 그대로 기록하되 워크플로 전체를 빨갛게 만들지는 않는다.
            KNOWN=$(grep -E '^KNOWN_FAIL=1' "$CONF" >/dev/null 2>&1 && echo 1 || echo 0)

            rm -rf "$OUT"; mkdir -p "$OUT"
            {
              docker run --rm --user "$(id -u):$(id -g)" \
                -v "$NESTC_UPSTREAM":/src -v "$GITHUB_WORKSPACE":/work -w /work \
                "$DOCKER_IMAGE" \
                bash scripts/gen-bundle.sh --conf "$CONF" \
                  --tools "$TOOLS_IN_CONTAINER" --upstream /src \
                  --out "/work/bundle-out/$m"

              ssh board "mkdir -p $BB"
              scp "$OUT"/*.cpp "$OUT"/*.h "$OUT"/*.bin "$OUT"/bundle.conf board:"$BB/"

              ssh board "set -eu
                export PATH=\$HOME/bin:\$PATH
                /home/xilinx/board-build-run.sh --bundle $BB \
                  --src $BOARD_SRC --build $BOARD_BUILD"
            } 2>&1 | tee "logs/$m.log" || true
            # 판정은 종료 코드가 아니라 로그의 판정 줄로 한다.
            # 번들은 추론에 성공하고도 0 이 아닌 값을 반환하는 경우가 있다.

            if grep -q '^== 전부 통과' "logs/$m.log"; then
              VERDICT="통과"
            else
              VERDICT="실패"
              [ "$KNOWN" = "1" ] || HARD_FAIL=1
            fi
            [ "$KNOWN" = "1" ] && [ "$VERDICT" = "실패" ] && VERDICT="실패 (알려진 실패)"

            # 추론 한 줄씩 뽑아 요약에 남긴다
            {
              echo "### $m — $VERDICT"
              echo ""
              echo '```'
              grep -E '^\s+(OK|FAIL) ' "logs/$m.log" || echo "(결과 줄 없음)"
              echo '```'
              echo ""
            } >> logs/summary.txt
            echo "::endgroup::"
          done

          echo "HARD_FAIL=$HARD_FAIL" >> "$GITHUB_ENV"

      # 네 코어를 동시에 연다. 단일 코어 모델 뒤에 두는 이유는, 4코어가
      # 중간에 죽어 CMA 를 들고 가더라도 단일 코어 판정은 이미 끝나 있게
      # 하려는 것이다. board-multi-run.sh 가 실행 전에 CMA 관문으로 막는다.
      # 판정은 라벨 비교가 아니라 "틀린 추론 0건 + 시간 줄" 이다.
      # 한 모델만 골라 돌릴 때(inputs.model)는 건너뛴다.
      - name: 4코어 멀티 EVTA
        if: ${{ inputs.model == '' }}
        run: |
          set -euo pipefail
          m=resnet18-4core
          CONF="models-multi/$m.conf"
          OUT="$GITHUB_WORKSPACE/multi-out/$m"
          BB="/home/xilinx/bundles/multi-$m"
          scp scripts/board-multi-run.sh board:/home/xilinx/board-multi-run.sh
          ssh board "chmod +x /home/xilinx/board-multi-run.sh"
          rm -rf "$OUT"; mkdir -p "$OUT"
          {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$NESTC_UPSTREAM":/src -v "$GITHUB_WORKSPACE":/work -w /work \
              "$DOCKER_IMAGE" \
              bash scripts/gen-bundle.sh --conf "$CONF" \
                --tools "$TOOLS_IN_CONTAINER" --upstream /src \
                --out "/work/multi-out/$m"

            ssh board "mkdir -p $BB"
            scp "$OUT"/*.cpp "$OUT"/*.h "$OUT"/*.bin "$OUT"/bundle.conf board:"$BB/"

            ssh board "set -eu
              export PATH=\$HOME/bin:\$PATH
              /home/xilinx/board-multi-run.sh --bundle $BB \
                --src $BOARD_SRC --build $BOARD_BUILD"
          } 2>&1 | tee "logs/multi-$m.log" || true

          if grep -q '^== 전부 통과' "logs/multi-$m.log"; then
            V="통과"
          else
            V="실패"
            echo "HARD_FAIL=1" >> "$GITHUB_ENV"
          fi
          {
            echo "### $m — $V"
            echo ""
            echo '```'
            grep -E '^   (총|장당|처리량|사용량|실행 중)|fpga_buff_|Check failed|^== (중단|실패)' \
              "logs/multi-$m.log" || echo "(측정값 없음)"
            echo '```'
            echo ""
          } >> logs/summary.txt

      # 결과를 저장소에 남긴다. 아티팩트를 받지 않아도 되게 하려는 것이다.
      # results/ 는 push 트리거 경로에 없으므로 자기 자신을 다시 부르지 않는다.
      - name: 결과를 저장소에 기록
        if: always()
        run: |
          set -eu
          mkdir -p results
          {
            echo "# model-test 결과"
            echo ""
            echo "- 시각: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 커밋: ${GITHUB_SHA:0:8}"
            echo "- 실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- 대상: ${LIST:-(없음)}${{ inputs.model == '' && ' + resnet18-4core(4코어)' || '' }}"
            echo "- 보드 빌드: $(basename "$BOARD_BUILD")"
            echo ""
            cat logs/summary.txt 2>/dev/null || echo "(요약 없음 — 실행 전에 멈췄다)"
          } > results/latest.md
          cp logs/*.log results/ 2>/dev/null || true
          # 생성된 번들 소스를 남긴다. 타일 인자, insert_tensor 호출, relu 스케일을
          # 보려고 매번 보드에 들어가는 일을 없애기 위함이다.
          for m in ${LIST:-}; do
            f=$(ls "bundle-out/$m"/*.cpp 2>/dev/null | grep -v '/Main\.cpp$' | head -1) || true
            [ -n "${f:-}" ] && cp "$f" "results/$m.net.cpp"
          done
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git commit -m "결과: model-test ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-test-${{ github.run_id }}
          path: logs/
          retention-days: 30

      - name: 키 정리
        if: always()
        run: rm -f ~/.ssh/board_key

      - name: 판정
        if: always()
        run: |
          cat logs/summary.txt 2>/dev/null || true
          [ "${HARD_FAIL:-0}" = "0" ] || { echo "알려지지 않은 실패가 있다"; exit 1; }
          echo "알려지지 않은 실패 없음"
