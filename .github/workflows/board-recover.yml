name: board-recover

# 보드가 이상할 때 쓰는 복구 도구. 수동 실행 전용이다.
#
# GitHub 클라우드 러너에서 돈다 — 연구실 PC 가 꺼져 있어도 쓸 수 있어야
# 하기 때문이다.
#
# 쓰는 때
#   VTA 실행이 "Check failed: fpga_buff_ != nullptr" 로 죽기 시작했다.
#   추론이 비정상 종료된 뒤(워크플로 취소, Ctrl+C, 멀티코어 CMA 실패)
#   FPGA 연속 메모리나 xlnk 가 정리되지 않으면 이후 모든 실행이 막힌다.
#
# 필요한 시크릿: BOARD_HOST BOARD_PORT BOARD_USER BOARD_SSH_KEY

# 주의 — 이 워크플로는 반드시 self-hosted(연구실 PC) 러너에서 돌아야 한다.
# GitHub 클라우드 러너에서 시도했다가 첫 SSH 에서 종료 코드 255(연결 실패)로
# 죽었다. 보드가 sota.pusan.ac.kr:25022 로 공개되어 있는데도 그렇다 —
# 교내 방화벽이 외부 IP 를 막는 것으로 보인다.
# 그래서 보드에 닿으려면 교내망 안에 있는 기계가 필요하다.
# 연구실 서버를 고를 때도 같은 조건이 걸린다.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "check=점검만, kill=남은 프로세스 정리, reboot=재부팅"
        type: choice
        options: [check, kill, reboot]
        default: check

# 복구 중에 다른 작업이 보드를 건드리지 않게 한다.
# 결과 요약을 저장소에 다시 커밋하기 위해 필요하다.
permissions:
  contents: write

concurrency:
  group: zcu102-board
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SSH 준비
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BOARD_SSH_KEY }}" > ~/.ssh/board_key
          chmod 600 ~/.ssh/board_key
          cat > ~/.ssh/config <<EOF
          Host board
            HostName ${{ secrets.BOARD_HOST }}
            Port ${{ secrets.BOARD_PORT }}
            User ${{ secrets.BOARD_USER }}
            IdentityFile ~/.ssh/board_key
            ConnectTimeout 10
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: 점검
        run: |
          set -eu
          mkdir -p logs
          {
            echo "=== 가동 시간 ==="   ; ssh board 'uptime'
            echo "=== 메모리/CMA ==="  ; ssh board 'free -h | head -2; grep -i cma /proc/meminfo || echo "(CMA 항목 없음)"'
            echo "=== xlnk ==="        ; ssh board 'ls -l /dev/xlnk'
            echo "=== 남은 프로세스 ===" ; ssh board "pgrep -a 'r[e]snet|s[q]ueezenet|v[t]a|m[u]lti' || echo '없음'"
          } 2>&1 | tee logs/recover-before.txt

      - name: 남은 프로세스 정리
        if: inputs.action == 'kill' || inputs.action == 'reboot'
        run: |
          set -eu
          # pkill -f 는 명령줄 전체를 대조한다. 패턴을 그대로 쓰면 이 명령을
          # 실행하는 원격 셸의 명령줄에도 그 문자열이 들어 있어 자기 자신을
          # 죽이고, SSH 가 끊기며 255 로 실패한다(2026-10-30 에 세 번 겪었다).
          # 정규식 r[e]snet 은 "resnet" 에는 맞고 명령줄의 "r[e]snet" 에는
          # 맞지 않으므로 자기 자신을 비켜 간다.
          ssh board "sudo pkill -f 'r[e]snet|s[q]ueezenet|m[u]lti' || true; sleep 2; pgrep -a 'r[e]snet|s[q]ueezenet|v[t]a|m[u]lti' || echo '정리됨'"

      # 재부팅은 마지막 수단이다. 돌아오지 않으면 연구실에서 직접 전원을
      # 내렸다 올려야 하므로, 사람이 명시적으로 고른 경우에만 한다.
      - name: 재부팅
        if: inputs.action == 'reboot'
        run: |
          set -eu
          echo "재부팅한다. 돌아오는 데 보통 1~2분."
          ssh board 'sudo nohup sh -c "sleep 2; reboot" >/dev/null 2>&1 &' || true
          sleep 45
          for i in $(seq 1 20); do
            if ssh -o ConnectTimeout=8 board 'uptime' >/dev/null 2>&1; then
              echo "돌아왔다 (시도 $i)"
              ssh board 'uptime; ls -l /dev/xlnk; grep -i cma /proc/meminfo' \
                2>&1 | tee logs/recover-after.txt
              exit 0
            fi
            echo "대기 중... ($i/20)"
            sleep 15
          done
          echo "5분 안에 돌아오지 않았다. 연구실에서 전원을 확인해야 한다." >&2
          exit 1

      # 결과를 저장소에 남긴다. 그래야 Actions 화면을 열지 않고도
      # 보드 상태를 확인할 수 있다.
      - name: 결과를 저장소에 기록
        if: always()
        run: |
          set -eu
          mkdir -p results
          {
            echo "# board-recover 결과"
            echo ""
            echo "- 시각: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 동작: ${{ inputs.action }}"
            echo "- 실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "## 실행 전"
            echo '```'
            cat logs/recover-before.txt 2>/dev/null || echo "(없음 — 연결 실패)"
            echo '```'
            echo ""
            echo "## 재부팅 후"
            echo '```'
            cat logs/recover-after.txt 2>/dev/null || echo "(재부팅하지 않았거나 돌아오지 않았다)"
            echo '```'
          } > results/board-recover.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git commit -m "결과: board-recover ${{ inputs.action }} ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || echo "푸시 실패 — 아래 내용을 직접 읽어야 한다"
          echo "--- results/board-recover.md ---"
          cat results/board-recover.md

      - name: 키 정리
        if: always()
        run: rm -f ~/.ssh/board_key
