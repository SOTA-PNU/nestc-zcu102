# 모델 기술서 — ResNet-18 멀티 EVTA (2코어)
#
# models/resnet18.conf 와 같은 모델이다. 다른 점은 번들을 2벌 만들어
# EVTA 코어에 하나씩 묶고, 2개 스레드가 동시에 돌린다는 것뿐이다.
#
# 한 장의 지연시간은 줄지 않는다. 늘어나는 것은 처리량이다.
# 2코어와 4코어를 모두 돌려 두 가지를 본다.
#   - 확장성: 코어를 늘린 만큼 처리량이 늘어나는가
#   - 한계:   4코어에서 FPGA 연속 메모리(CMA)가 모자라는가
#            (처음 4코어 시도는 dat_queue.h 의 fpga_buff_ != nullptr 로 죽었다)

MODEL_NAME=resnet18-2core

MODEL_ONNX=upstream:build/models/mxnet_exported_resnet18.onnx
INPUT_NAME=data
INPUT_SHAPE="[1,224,224,3]"
IMAGE_LAYOUT=NHWC
IMAGE_MODE=0to255
USE_IMAGENET_NORMALIZATION=0
CALIB_EXTRA="-compute-softmax -topk=5"
CALIB_IMAGES=upstream:glow/tests/images/imagenet/cat_285.png
OUTPUT_NAME=resnetv10_dense0_fwd__1

MULTI_EVTA=1
MULTI_CORES=2

# 상류 MultiEVTAResnet18Test 의 4스레드 main 을 틀로 쓴다.
# 코어 수가 4 보다 적으면 ci/make_multi_main.py 가 스레드를 줄인다.
MAIN_TEMPLATE=upstream:vta/multievta_bundles/MultiEVTAResnet18Test/multi_threads_main.cpp

MULTI_EXPECT=281
