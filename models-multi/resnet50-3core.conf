# 모델 기술서 — ResNet-50 멀티 EVTA (3코어)
#
# models/resnet50.conf 와 같은 모델·전처리다(Caffe2 판, NCHW, 0~1, BGR).
# 번들을 3벌 만들어 EVTA 코어 0~2 에 하나씩 묶고 3개 스레드가 동시에 돌린다.
#
# CMA 가 관건이다. 코어마다 명령 큐 32MB 에 가중치 25.6MB(ResNet-18 의 2배)가
# 붙는다. 2026-11-04 보드 실측(1/2/3/4코어): 2.43/4.29/5.59/6.47 img/s, 전부
# 정답, oops 0. 실행 중 최저 CMA 여유 194/135/33/2.8 MB — 4코어는 겨우 들어간다.
# 3코어가 CI 용 안정 구성이고, 4코어는 여유가 없어 앞선 누수가 조금만 있어도
# board-multi-run 의 CMA 관문에서 멈춘다.

MODEL_NAME=resnet50-3core

MODEL_ONNX=https://gitlab.com/yongin.kwon/nestc-data/-/raw/master/VTABundleTests/Resnet50/resnet50.onnx
INPUT_NAME=gpu_0/data_0
INPUT_SHAPE="[1,3,224,224]"
IMAGE_LAYOUT=NCHW
IMAGE_MODE=0to1
USE_IMAGENET_NORMALIZATION=0
CHANNEL_ORDER=BGR
CALIB_EXTRA="-compute-softmax -topk=5"
CALIB_IMAGES=upstream:glow/tests/images/imagenet/cat_285.png
OUTPUT_NAME=gpu_0_softmax_1

MULTI_EVTA=1
MULTI_CORES=3

# 상류 MultiEVTAResnet18Test 의 4스레드 main 을 틀로 쓴다. 입력 심볼, NCHW,
# 채널 순서는 gen-bundle 이 단일 코어와 똑같이 고쳐 넣는다.
MAIN_TEMPLATE=upstream:vta/multievta_bundles/MultiEVTAResnet18Test/multi_threads_main.cpp

MULTI_EXPECT=281
