# 모델 기술서 — ResNet-18 멀티 EVTA (4코어)
#
# models/resnet18.conf 와 같은 모델이다. 다른 점은 번들을 네 벌 만들어
# EVTA 코어 0~3 에 하나씩 묶고, 네 스레드가 동시에 돌린다는 것뿐이다.
#
# 한 장의 지연시간은 줄지 않는다. 늘어나는 것은 처리량이다.
# 비트스트림이 VTA_DEVICE_NUM=4 로 네 코어를 담고 있는데 지금까지 모든
# 번들이 코어 0 만 썼다. 즉 하드웨어의 1/4 만 쓰고 있었다.

MODEL_NAME=resnet18-multi

MODEL_ONNX=upstream:build/models/mxnet_exported_resnet18.onnx
INPUT_NAME=data
INPUT_SHAPE="[1,224,224,3]"
IMAGE_LAYOUT=NHWC
IMAGE_MODE=0to255
USE_IMAGENET_NORMALIZATION=0
CALIB_EXTRA="-compute-softmax -topk=5"
CALIB_IMAGES=upstream:glow/tests/images/imagenet/cat_285.png
OUTPUT_NAME=resnetv10_dense0_fwd__1

# 번들을 네 벌 만든다 (-index-multi-evta=1/2/4/8).
MULTI_EVTA=1

# 네 스레드로 도는 main. 상류 MultiEVTAResnet18Test 의 것을 틀로 쓴다.
# 전처리 치환은 단일 코어 틀과 똑같이 적용된다.
MAIN_TEMPLATE=upstream:vta/multievta_bundles/MultiEVTAResnet18Test/multi_threads_main.cpp

# 멀티 틀은 기대 라벨이 281 로 박혀 있다. conf 값으로 치환한다.
MULTI_EXPECT=281

# 이 설정은 board-multi-run.sh 가 쓴다. EXPECT 는 쓰지 않는다 —
# 판정이 라벨 비교가 아니라 "틀린 추론 0건 + 총 시간" 이기 때문이다.
