# 이분 탐색 — SqueezeNet 을 fire5(concat3) 에서 자른 모델
#
# 보드가 905/904/533 으로 틀리는 지점을 찾기 위한 것이다. 모델을 중간에서
# 끊으면 그 텐서가 출력이 되고, 같은 입력으로 인터프리터와 보드를 각각
# 끝까지 돌려 답을 비교할 수 있다. 갈라지면 그 앞에 범인이 있고, 같으면
# 뒤에 있다. fire 모듈 여덟 개의 중간부터 시작한다.
#
# 기준값은 CI 로그의 「1-b단계 인터프리터 기준값」 에서 읽는다.
# EXPECT 의 숫자는 뜻이 없다 — 보드가 낸 실제 값을 로그에서 보려는 것이다.

MODEL_NAME=sq-cut-fire5

MODEL_ONNX=upstream:build/models/squeezenet.onnx
INPUT_NAME=data
INPUT_SHAPE="[1,3,224,224]"
IMAGE_LAYOUT=NCHW
IMAGE_MODE=0to1
USE_IMAGENET_NORMALIZATION=1
CHANNEL_ORDER=RGB
CALIB_IMAGES=upstream:glow/tests/images/imagenet/cat_285.png

# 여기서 끊는다. 이름이 틀리면 CI 로그에 고를 수 있는 지점 목록이 찍힌다.
ONNX_CUT_AT=squeezenet0_concat3

# 잘린 모델의 출력 심볼. 첫 실행 로그의 「번들이 내보내는 심볼」 에서 확인하고
# 틀렸으면 고친다.
OUTPUT_NAME=squeezenet0_concat3__1

EXPECT="cat_285:0"
KNOWN_FAIL=1
