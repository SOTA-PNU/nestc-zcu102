name: debug-dump

# 보드 결과가 틀릴 때 어느 층에서 갈라지는지 찾는다.
#
# 번들을 -instrument-debug 로 만들면 층마다 중간 텐서를 .bin 으로 떨군다.
# 보드에서 한 번 돌린 뒤 그 파일들을 실행 순서대로 훑어 분포를 본다.
# 전부 0, 전부 같은 값, 포화 과다 같은 것이 처음 나타나는 층이 범인이다.
#
# 느리고 파일이 많이 생기므로 수동 실행 전용이다.
# 평소 회귀 검사는 model-test 가 한다.
#
# 필요한 시크릿: BOARD_HOST BOARD_PORT BOARD_USER BOARD_SSH_KEY

on:
  workflow_dispatch:
    inputs:
      model:
        description: "models/ 아래 conf 이름 (확장자 제외)"
        type: string
        default: squeezenet

concurrency:
  group: zcu102-board
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dump:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180

    env:
      MODEL: ${{ inputs.model }}
      BOARD_SRC: /home/xilinx/nest-compiler-2024
      BOARD_BUILD: /home/xilinx/nest-compiler-2024/build_board
      DOCKER_IMAGE: leejaymin/nestc-ssh:latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SSH 준비
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BOARD_SSH_KEY }}" > ~/.ssh/board_key
          chmod 600 ~/.ssh/board_key
          cat > ~/.ssh/config <<EOF
          Host board
            HostName ${{ secrets.BOARD_HOST }}
            Port ${{ secrets.BOARD_PORT }}
            User ${{ secrets.BOARD_USER }}
            IdentityFile ~/.ssh/board_key
            ServerAliveInterval 60
            ServerAliveCountMax 10
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          ssh board 'uname -m'

      - name: 컴파일러 준비
        run: |
          set -eu
          UP=${NESTC_UPSTREAM:-$HOME/nestc-upstream}
          echo "NESTC_UPSTREAM=$UP" >> "$GITHUB_ENV"
          echo "TOOLS_IN_CONTAINER=/src/build/glow/bin" >> "$GITHUB_ENV"
          docker image inspect "$DOCKER_IMAGE" >/dev/null 2>&1 || docker pull "$DOCKER_IMAGE"
          for p in ci/patch_concat.py ci/patch_tiling.py; do
            [ -f "$p" ] && python3 "$p" "$UP"
          done
          docker run --rm -v "$UP":/root/nestc -w /root/nestc/build \
            "$DOCKER_IMAGE" ninja model-compiler image-classifier

      - name: 계측 번들 생성
        run: |
          set -euo pipefail
          mkdir -p logs
          OUT="$GITHUB_WORKSPACE/debug-out/$MODEL"
          rm -rf "$OUT"; mkdir -p "$OUT"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e INSTRUMENT_DEBUG=1 \
            -v "$NESTC_UPSTREAM":/src -v "$GITHUB_WORKSPACE":/work -w /work \
            "$DOCKER_IMAGE" \
            bash scripts/gen-bundle.sh --conf "models/$MODEL.conf" \
              --tools "$TOOLS_IN_CONTAINER" --upstream /src \
              --out "/work/debug-out/$MODEL" 2>&1 | tee "logs/gen-$MODEL.log"
          ls -la "$OUT"

      # 덤프는 작업 디렉터리에 쌓인다. 기존 번들 디렉터리를 더럽히지 않도록
      # 전용 디렉터리를 쓴다.
      - name: 보드에서 돌리고 분석
        run: |
          set -euo pipefail
          BB="/home/xilinx/bundles/debug-$MODEL"
          ssh board "rm -rf $BB; mkdir -p $BB"
          scp "$GITHUB_WORKSPACE/debug-out/$MODEL"/*.cpp \
              "$GITHUB_WORKSPACE/debug-out/$MODEL"/*.h \
              "$GITHUB_WORKSPACE/debug-out/$MODEL"/*.bin \
              "$GITHUB_WORKSPACE/debug-out/$MODEL"/bundle.conf \
              "$GITHUB_WORKSPACE/debug-out/$MODEL"/calib.yaml board:"$BB/"
          scp scripts/board-build-run.sh board:/home/xilinx/board-build-run.sh
          scp ci/analyze_debug_dump.py board:/home/xilinx/analyze_debug_dump.py
          ssh board "chmod +x /home/xilinx/board-build-run.sh"

          # 추론은 틀려도 상관없다. 필요한 것은 떨어진 .bin 들이다.
          ssh board "set -eu
            export PATH=\$HOME/bin:\$PATH
            /home/xilinx/board-build-run.sh --bundle $BB \
              --src $BOARD_SRC --build $BOARD_BUILD || true
            echo '--- 덤프 개수 ---'
            ls $BB/*.bin | wc -l
            echo '--- 분석 ---'
            python3 /home/xilinx/analyze_debug_dump.py $BB $BB/calib.yaml" \
            2>&1 | tee "logs/dump-$MODEL.log"

      - name: 결과를 저장소에 기록
        if: always()
        run: |
          set -eu
          mkdir -p results
          {
            echo "# debug-dump 결과 — $MODEL"
            echo ""
            echo "- 시각: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo '```'
            sed -n '/--- 분석 ---/,$p' "logs/dump-$MODEL.log" 2>/dev/null | head -200
            echo '```'
            echo ""
            echo "## 보정 범위 (calib.yaml)"
            echo ""
            echo "덤프의 int8 최대값에 그 층의 스케일을 곱한 값이 아래 범위와"
            echo "크게 다르면 그 층에서 크기가 어긋난 것이다."
            echo '```'
            sed -n '1,400p' "debug-out/$MODEL/calib.yaml" 2>/dev/null || echo "(없음)"
            echo '```'
          } > "results/debug-$MODEL.md"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git commit -m "결과: debug-dump $MODEL ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump-${{ github.run_id }}
          path: logs/
          retention-days: 30

      - name: 키 정리
        if: always()
        run: rm -f ~/.ssh/board_key
