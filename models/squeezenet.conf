# 모델 기술서 — SqueezeNet 1.1
#
# 상류에는 SqueezeNet 의 VTA 레시피가 없다.
# examples/bundles/squeezenet 은 -backend=CPU 로 float 번들만 만든다.
# 아래 값은 우리가 맞춘 것이다(2026-10-08).
#
# 이 모델의 의의는 Concat 이다. Fire 모듈마다 expand1x1 과 expand3x3 을
# 이어 붙이므로, VTA 백엔드의 InsertTensorInst/TouchInst 지원을 시험한다.
#
# 쓰는 연산자: AveragePool Concat Conv Dropout MaxPool Relu Reshape
# Concat 말고는 ResNet 에서 이미 도는 것들이다. Dropout 은 추론에서 항등이라
# Glow 가 접고, Reshape 는 TensorView 로 내려간다.

MODEL_NAME=squeezenet

MODEL_ONNX=upstream:build/models/squeezenet.onnx

# ONNX 에서 직접 읽었다. 상류 CPU 예제는 data_0 를 쓰지만 그건 S3 에서 받는
# 다른 SqueezeNet 파일이다. build/models/squeezenet.onnx 의 입력은 data 다.
INPUT_NAME=data

# 이 ONNX 는 입력을 [1,3,224,224] NCHW 로 선언한다. 선언을 그대로 따른다.
# ResNet-18 이 NHWC 였던 것은 그 ONNX 가 NHWC 로 선언되어 있기 때문이며,
# 모델마다 다르므로 추측하지 말고 onnx 에서 읽는다.
INPUT_SHAPE="[1,3,224,224]"
IMAGE_LAYOUT=NCHW
# 이 모델은 정규화를 품고 있지 않다(첫 노드가 바로 Conv 다).
# 0to255 로 넣으면 활성값이 폭주해 softmax 가 NaN 이 된다.
IMAGE_MODE=0to1
USE_IMAGENET_NORMALIZATION=1
CALIB_EXTRA="-compute-softmax -topk=5"

# 보드의 Main.cpp 전처리. 보정 단계와 반드시 맞아야 한다.
# 틀(ResNet-18 용)은 RGB 를 BGR 로 뒤집는데, 이 모델은 RGB 그대로다.
CHANNEL_ORDER=RGB

CALIB_IMAGES=upstream:glow/tests/images/imagenet/cat_285.png

# Main.cpp 는 자동 생성한다. 분류 모델이라 ResNet-18 의 틀이 그대로 맞는다.

# gen-bundle.sh 가 출력한 후보에서 골랐다.
OUTPUT_NAME=squeezenet0_flatten0_reshape0__1

# 기준값. PC 의 Interpreter 백엔드(float)로 떴다.
#   cat_285 -> 281 (0.4366)  dog_207 -> 205 (0.3526)  zebra_340 -> 340 (0.9996)
# 개가 205(flat-coated retriever)인 것은 모델이 207(golden retriever)과
# 헷갈린 것이다. 모델의 답이므로 그대로 기준으로 삼는다.
#
# 이것은 float 기준이다. 보드는 int8 이라 양자화 손실로 달라질 수 있다.
# 어긋나면 VTAInterpreter 로 한 장만 돌려 양자화 탓인지 버그인지 가린다.
EXPECT="cat_285:281 dog_207:205 zebra_340:340"
