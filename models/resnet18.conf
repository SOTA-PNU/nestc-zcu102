# 모델 기술서 — ResNet-18
#
# scripts/gen-bundle.sh 와 scripts/board-build-run.sh 가 이 파일을 읽는다.
# 셸이 source 하므로 공백 없이 KEY=VALUE 로 쓴다.
#
# 경로 앞의 upstream: 접두사는 상류 소스 트리 기준 상대 경로를 뜻한다.
# PC 에서는 $NESTC_SRC, 보드에서는 $BOARD_SRC 로 각각 해석된다.

MODEL_NAME=resnet18

# ONNX 모델. repo: 는 이 저장소 기준, upstream: 은 상류 트리 기준,
# http(s):// 로 시작하면 내려받는다.
MODEL_ONNX=upstream:examples/bundles/resnet18/mxnet_exported_resnet18.onnx

# model-compiler -model-input 에 그대로 들어간다.
INPUT_NAME=data
INPUT_SHAPE=1,3,224,224

# image-classifier 의 전처리 설정.
IMAGE_LAYOUT=NCHW
IMAGE_MODE=0to1
USE_IMAGENET_NORMALIZATION=1

# 보정에 쓸 이미지. 글롭을 허용한다.
# 많을수록 보정이 정확해지지만 느려진다. 20~100장이 통상 범위다.
CALIB_IMAGES=upstream:glow/tests/images/imagenet/*.png

# 번들을 실행 파일로 만들 때 쓸 main. 상류가 모델마다 제공한다.
# 새 모델이라면 비슷한 모델의 것을 복사해 심볼 이름을 맞춰야 한다.
MAIN_CPP=upstream:vta/bundles/Resnet18Test/mxnet_exported_resnet18BundleMain.cpp

# 판정 기준. "이미지이름:기대클래스" 를 공백으로 구분한다.
# 이미지는 CALIB_IMAGES 와 같은 디렉터리에서 찾는다.
# 새 모델은 float 또는 VTAInterpreter 결과를 먼저 떠서 여기에 적는다.
EXPECT=cat_285:281 dog_207:207 zebra_340:340
