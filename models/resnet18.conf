# 모델 기술서 — ResNet-18
#
# 값은 상류 vta/bundles/Resnet18Test/CMakeLists.txt 의 명령을 그대로 옮긴 것이다.
# 추측하지 말고 상류가 실제로 통과시킨 인자를 쓴다.
#
# scripts/gen-bundle.sh 와 scripts/board-build-run.sh 가 이 파일을 읽는다.
# 셸이 source 하므로 KEY=VALUE 로 쓰고, 공백이 들어가면 따옴표로 감싼다.
#
# 경로 앞의 upstream: 은 상류 소스 트리 기준, repo: 는 이 저장소 기준이다.
# http(s):// 로 시작하면 내려받는다.

MODEL_NAME=resnet18

# 상류 빌드가 내려받아 두는 위치다. build/ 는 지워질 수 있으므로
# 장기적으로는 저장소에 고정하는 편이 낫다.
MODEL_ONNX=upstream:build/models/mxnet_exported_resnet18.onnx

INPUT_NAME=data

# model-compiler -model-input 에 그대로 들어간다. 대괄호를 포함한다.
# Glow 는 내부적으로 NHWC 로 다루므로 채널이 마지막이다.
INPUT_SHAPE="[1,224,224,3]"

# image-classifier 전처리. 상류는 NHWC + 0to255 이며 정규화를 쓰지 않는다.
IMAGE_LAYOUT=NHWC
IMAGE_MODE=0to255
USE_IMAGENET_NORMALIZATION=0
CALIB_EXTRA="-compute-softmax -topk=5"

# 상류는 보정에 고양이 한 장만 쓴다. 바꾸면 양자화 스케일이 달라져
# 배포 번들과의 비트 단위 비교가 성립하지 않는다.
# 정확도를 높이려면 장수를 늘리되, 그때는 기준값을 새로 떠야 한다.
CALIB_IMAGES=upstream:glow/tests/images/imagenet/cat_285.png

# 번들을 실행 파일로 만들 때 쓸 main.
# 상류는 모델마다 전용 main 을 두지만, 모델에 종속된 식별자는 접두사 하나에서
# 파생되는 여섯 군데뿐이다. 그래서 MAIN_CPP 를 비우면 ResNet-18 의 main 을
# 틀로 삼아 접두사를 치환해 생성한다. 그때 OUTPUT_NAME 이 필요하다.
#
# 분류 모델이 아니거나 출력 해석이 다르면 전용 main 을 지정한다.
#MAIN_CPP=upstream:vta/bundles/Resnet18Test/mxnet_exported_resnet18BundleMain.cpp

# 번들이 내보내는 출력 텐서 이름. 접두사에서 파생되지 않아 따로 적어야 한다.
# gen-bundle.sh 가 번들 생성 후 후보 목록을 출력하므로 거기서 고른다.
OUTPUT_NAME=resnetv10_dense0_fwd__1

# 판정 기준. "이미지이름:기대클래스" 를 공백으로 구분한다.
# 285(Egyptian cat)를 281(tabby cat)로 내는 것은 오동작이 아니다.
# int8 양자화 모델에서 흔한 혼동이며 확신도가 0.478로 낮다.
EXPECT="cat_285:281 dog_207:207 zebra_340:340"
