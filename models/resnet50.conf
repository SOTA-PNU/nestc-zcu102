# 모델 기술서 — ResNet-50 (Caffe2 판, 2026-11-04)
#
# 상류 vta/bundles/Resnet50Test 의 레시피를 따른다. 모델 파일은 삭제된 S3
# (nestc-data-pub/VTABundleTests/Resnet50/resnet50.onnx) 대신 같은 내용의
# GitLab 미러에서 받는다. 102MB 라 실행마다 받는다.
#
# ResNet-18 과 다른 점은 입력이다. Caffe2 에서 온 모델이라 NCHW, 0~1 범위,
# BGR, ImageNet 정규화 없음 — 상류 보정 명령(-image-layout=NCHW
# -image-mode=0to1, 정규화 옵션 없음)과 상류 main 과 같다.
# 입력이 NCHW 이므로 gen-bundle 이 main 의 NHWC 전치를 끈다.

MODEL_NAME=resnet50

MODEL_ONNX=https://gitlab.com/yongin.kwon/nestc-data/-/raw/master/VTABundleTests/Resnet50/resnet50.onnx
INPUT_NAME=gpu_0/data_0
INPUT_SHAPE="[1,3,224,224]"
IMAGE_LAYOUT=NCHW
IMAGE_MODE=0to1
USE_IMAGENET_NORMALIZATION=0
CALIB_EXTRA="-compute-softmax -topk=5"
CALIB_IMAGES=upstream:glow/tests/images/imagenet/cat_285.png
# 번들 심볼 표의 출력. ResNet-18 과 같은 자리(오프셋 602112, 1000개)다.
OUTPUT_NAME=gpu_0_softmax_1

# 2026-11-04 WSL 에서 생성 시험: 합성곱 52개가 VTA, 첫 7x7 하나만 CPU.
# 양자화 인터프리터 답 281 / 207 / 340 (아래 기대값과 같음).
EXPECT="cat_285:281 dog_207:207 zebra_340:340"
